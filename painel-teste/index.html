<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de teste K-line</title>
<style>
  :root { color-scheme: dark; --fundo: #111; --cartao: #1c1c1c; --texto: #eee; --fraco: #999; --barra: #3a8; --alerta: #d55; }
  body { margin: 0; padding: 16px; background: var(--fundo); color: var(--texto); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .conexao { color: var(--fraco); margin: 0 0 12px; }
  .conexao.ativo { color: var(--barra); }
  .conexao.erro, .conexao.sem_resposta { color: var(--alerta); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .cartao { background: var(--cartao); border-radius: 8px; padding: 10px; }
  .cartao.fora { outline: 2px solid var(--alerta); }
  .cartao h2 { font-size: 13px; font-weight: 500; color: var(--fraco); margin: 0; }
  .selo { font-size: 10px; border: 1px solid var(--fraco); border-radius: 4px; padding: 0 4px; }
  .valor { margin: 4px 0 6px; } .valor b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .trilho { height: 4px; background: #333; border-radius: 2px; } .barra { height: 100%; background: var(--barra); border-radius: 2px; }
  .bruto { list-style: none; padding: 0; margin-top: 16px; color: var(--fraco); font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>Painel de teste K-line <small>(offsets e fórmulas são hipótese)</small></h1>
<main id="painel"></main>
<script type="module">
  import { conectar } from "./painel.mjs";
  conectar(`ws://${location.host}/ws`, document.getElementById("painel"));
</script>
</body>
</html>
