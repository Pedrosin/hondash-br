; Adaptador K-line -> BLE.
;   pio run -e esp32dev          compila o alvo
;   pio test -e native           testes no host (o suite test_emulador sobe o emulador Python sozinho)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
test_ignore = *

[env:native]
platform = native
test_framework = custom
extra_scripts = pre:scripts/toolchain_native.py
build_flags = -Wall -Wextra
